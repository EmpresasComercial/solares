<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>AliExpress24</title>
    <link rel="icon" type="image/png" href="/update_logo_canadianSolar.png" />
    <link rel="shortcut icon" href="/update_logo_canadianSolar.png" />
    <link rel="apple-touch-icon" href="/update_logo_canadianSolar.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('Service Worker registrado com sucesso:', reg))
            .catch(err => console.error('Falha ao registrar Service Worker:', err));
        });
      }
    </script>
  </body>
</html>
